<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔪 Sofia's Scream Log</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#000;
    --card:#111;
    --red:#b30000;
    --text:#f2f2f2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* фон */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(255,0,0,.12),
    transparent 70%);
    animation:pulse 5s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.4;
    }
    50%{
        opacity:1;
    }
}

/* VHS */

.vhs{
    position:fixed;
    inset:0;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03),
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 4px
    );
    pointer-events:none;
}

/* окно */

.window{
    width:90%;
    max-width:700px;
    background:rgba(10,10,10,.9);
    border:1px solid rgba(255,0,0,.35);
    border-radius:24px;
    padding:50px;
    position:relative;
    z-index:5;
    backdrop-filter:blur(10px);

    box-shadow:
    0 0 40px rgba(255,0,0,.2),
    0 0 80px rgba(255,0,0,.1);

    animation:appear 1.5s ease;
}

@keyframes appear{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

h1{
    font-family:'Creepster',cursive;
    font-size:4rem;
    text-align:center;
    margin-bottom:10px;
    color:white;

    text-shadow:
    0 0 10px red,
    0 0 30px darkred;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:40px;
    letter-spacing:3px;
}

/* запись */

.entry{
    background:#0d0d0d;
    border:1px solid rgba(255,0,0,.25);
    border-radius:18px;
    padding:35px;
    transition:.4s;
}

.entry:hover{
    transform:translateY(-5px);
    box-shadow:0 0 30px rgba(255,0,0,.2);
}

.entry h2{
    font-size:2rem;
    color:white;
    margin-bottom:20px;
}

.date{
    display:inline-block;
    background:darkred;
    padding:8px 16px;
    border-radius:999px;
    font-size:.95rem;
    margin-bottom:25px;
    box-shadow:0 0 15px rgba(255,0,0,.5);
}

.entry p{
    color:#ccc;
    line-height:1.9;
    font-size:1.08rem;
}

/* кровь */

.drip{
    position:fixed;
    top:-300px;
    width:4px;
    background:linear-gradient(
        to bottom,
        transparent,
        red
    );
    border-radius:20px;
    opacity:.7;
    animation:drip linear infinite;
}

.drip:nth-child(1){
    left:10%;
    height:240px;
    animation-duration:9s;
}

.drip:nth-child(2){
    left:35%;
    height:180px;
    animation-duration:12s;
}

.drip:nth-child(3){
    left:60%;
    height:320px;
    animation-duration:8s;
}

.drip:nth-child(4){
    left:85%;
    height:200px;
    animation-duration:14s;
}

@keyframes drip{
    from{
        transform:translateY(-300px);
    }
    to{
        transform:translateY(150vh);
    }
}

/* footer */

footer{
    margin-top:35px;
    text-align:center;
    color:#666;
    font-size:.95rem;
}

/* mobile */

@media(max-width:768px){

    .window{
        padding:30px 22px;
    }

    h1{
        font-size:2.8rem;
    }

    .entry h2{
        font-size:1.6rem;
    }

}

</style>
</head>
<body>

<!-- кровь -->

<div class="drip"></div>
<div class="drip"></div>
<div class="drip"></div>
<div class="drip"></div>

<!-- VHS -->

<div class="vhs"></div>

<!-- окно -->

<div class="window">

<h1>Sofia's Scream Log</h1>

<div class="subtitle">
NEW RECORD
</div>

<div class="entry">

<div class="date">
26 МАЯ
</div>

<h2>Пара 26 мая</h2>

<p>
Сегодня была пара 26 мая.  
Добавлена новая запись в журнал Sofia's Scream Log.  
Все остальные окна удалены — осталось только одно главное окно с новой записью.
</p>

</div>

<footer>
© 2026 Sofia's Scream Log
</footer>

</div>

</body>
</html>
